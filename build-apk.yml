name: Build Yevmiye Defteri APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Android project
        shell: bash
        run: |
          set -e
          mkdir -p "$(dirname 'settings.gradle.kts')"
          echo '' | base64 -d > 'settings.gradle.kts'
          mkdir -p "$(dirname 'README_GITHUB.md')"
          echo '' | base64 -d > 'README_GITHUB.md'
          mkdir -p "$(dirname 'build.gradle.kts')"
          echo 'cGx1Z2lucyB7CiAgICBpZCgiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iKSB2ZXJzaW9uICI4LjEzLjAiIGFwcGx5IGZhbHNlCiAgICBpZCgib3JnLmpldGJyYWlucy5rb3RsaW4uYW5kcm9pZCIpIHZlcnNpb24gIjIuMi4yMCIgYXBwbHkgZmFsc2UKICAgIGlkKCJvcmcuamV0YnJhaW5zLmtvdGxpbi5wbHVnaW4uY29tcG9zZSIpIHZlcnNpb24gIjIuMi4yMCIgYXBwbHkgZmFsc2UKfQo=' | base64 -d > 'build.gradle.kts'
          mkdir -p "$(dirname 'gradle.properties')"
          echo 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmtvdGxpbi5jb2RlLnN0eWxlPW9mZmljaWFsCg==' | base64 -d > 'gradle.properties'
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          echo '' | base64 -d > 'app/build.gradle.kts'
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          echo '' | base64 -d > 'app/src/main/AndroidManifest.xml'
          mkdir -p "$(dirname 'app/src/main/java/com/alitekintm/yevmiye/MainActivity.kt')"
          echo '' | base64 -d > 'app/src/main/java/com/alitekintm/yevmiye/MainActivity.kt'
          mkdir -p "$(dirname 'app/src/main/res/values/strings.xml')"
          echo 'PHJlc291cmNlcz48c3RyaW5nIG5hbWU9ImFwcF9uYW1lIj5ZZXZtaXllIERlZnRlcmk8L3N0cmluZz48L3Jlc291cmNlcz4K' | base64 -d > 'app/src/main/res/values/strings.xml'
          mkdir -p "$(dirname 'app/src/main/res/values/themes.xml')"
          echo 'PHJlc291cmNlcz48c3R5bGUgbmFtZT0iVGhlbWUuWWV2bWl5ZURlZnRlcmkiIHBhcmVudD0iYW5kcm9pZDpzdHlsZS9UaGVtZS5NYXRlcmlhbC5Ob0FjdGlvbkJhciIgLz48L3Jlc291cmNlcz4K' | base64 -d > 'app/src/main/res/values/themes.xml'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YevmiyeDefteri-debug
          path: app/build/outputs/apk/debug/app-debug.apk
